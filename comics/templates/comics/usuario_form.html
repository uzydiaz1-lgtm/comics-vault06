{% extends 'comics/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-12 p-8 bg-white border-4 border-black neo-shadow text-black">
    <h2 class="text-3xl font-black uppercase mb-6 text-center border-b-4 border-black pb-3">{{ accion }} Perfil de Lector</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-3 font-bold">{{ form.as_p }}</div>
        <button type="submit" class="w-full border-4 border-black bg-blue-400 text-black font-black uppercase py-3 hover:bg-black hover:text-white transition-colors neo-shadow">Guardar</button>
    </form>
</div>
{% endblock %}
