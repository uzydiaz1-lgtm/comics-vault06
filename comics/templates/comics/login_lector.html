{% extends 'comics/base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-8 bg-yellow-400 border-8 border-black neo-shadow">
    <h2 class="text-3xl font-black uppercase text-center mb-6 border-b-4 border-black pb-2">Acceso a la Bóveda</h2>
    <p class="font-bold text-center mb-6">Ingresa con tu cuenta de Lector para gestionar tus cómics favoritos.</p>

    <form method="post" action="{% url 'comics:login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-6 border-4 border-black bg-black text-white font-black uppercase py-3 hover:bg-white hover:text-black transition-colors neo-shadow">
            Ingresar como Lector
        </button>
    </form>

    <div class="mt-6 text-center border-t-4 border-black pt-4">
        <p class="font-bold text-sm">¿No tienes cuenta? <a href="{% url 'comics:registro' %}" class="underline text-red-600 font-black">Únete al Club</a></p>
    </div>
</div>
{% endblock %}
