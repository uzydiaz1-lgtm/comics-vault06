{% extends 'comics/base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-8 bg-white border-4 border-black neo-shadow text-black">
    <h2 class="text-3xl font-black uppercase mb-6 text-center border-b-4 border-black pb-2">Iniciar Sesión</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-2">
            {{ form.as_p }}
        </div>
        <button type="submit" class="w-full border-4 border-black bg-yellow-400 text-black font-black uppercase py-3 hover:bg-black hover:text-white transition-colors neo-shadow">
            Entrar
        </button>
    </form>
    <p class="mt-4 text-center font-bold">¿No tienes cuenta? <a href="{% url 'comics:registro' %}" class="underline">Regístrate aquí</a></p>
</div>
{% endblock %}
