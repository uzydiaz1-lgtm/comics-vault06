{% extends 'comics/base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-8 bg-white border-4 border-black neo-shadow text-black text-center">
    <h2 class="text-3xl font-black uppercase mb-4 text-red-500">¿Estás seguro?</h2>
    <p class="font-bold text-lg mb-6">Vas a eliminar el cómic: <br><span class="text-2xl uppercase border-b-4 border-black inline-block mt-2">{{ comic.titulo }}</span></p>

    <form method="post" class="flex gap-4">
        {% csrf_token %}
        <button type="submit" class="flex-1 border-4 border-black bg-red-500 text-white font-black uppercase py-3 hover:bg-black transition-colors neo-shadow">
            Sí, Eliminar
        </button>
        <a href="{% url 'comics:detalle_comic' comic.pk %}" class="flex-1 border-4 border-black bg-gray-200 text-black font-black uppercase py-3 flex items-center justify-center hover:bg-black hover:text-white transition-colors neo-shadow">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
