{% extends 'comics/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-8 sm:my-12 p-4 sm:p-8 bg-white border-4 border-black neo-shadow text-black">
    <h2 class="text-3xl font-black uppercase mb-6 text-center border-b-4 border-black pb-3">Editar Cómic</h2>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-3 font-bold">
            {{ form.as_p }}
        </div>
        <div class="flex flex-col sm:flex-row gap-4 pt-6">
            <button type="submit" class="flex-1 border-4 border-black bg-blue-400 text-black font-black uppercase py-3 hover:bg-black hover:text-white transition-colors neo-shadow">
                Guardar
            </button>
            <a href="{% url 'comics:catalogo' %}" class="flex-1 text-center border-4 border-black bg-gray-200 text-black font-black uppercase py-3 hover:bg-black hover:text-white transition-colors neo-shadow">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
